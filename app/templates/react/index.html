{% load static %}
<!doctype html>
<html lang="en" data-theme="dark" data-theme-preference="system" data-accent="purple">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07090f">
    <title>OrbitLink React</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'react/app.css' %}">
  </head>
  <body class="app-authenticated react-application">
    <div id="root"></div>
    <script type="module" src="{% static 'react/app.js' %}"></script>
  </body>
</html>
